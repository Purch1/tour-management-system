# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - tour-system

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://testcicdwithdockerw.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_a79fc0105b68438187febf9650205f4d }}
        password: ${{ secrets.AzureAppService_ContainerPassword_eb4a6a9f097740c3ae0cf43384f1fc3f }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: testcicdwithdockerw.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_a79fc0105b68438187febf9650205f4d }}/TestCicdwithDockerW:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'tour-system'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_1850f33746d8451b87e077841676a98a }}
        images: 'testcicdwithdockerw.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_a79fc0105b68438187febf9650205f4d }}/TestCicdwithDockerW:${{ github.sha }}'